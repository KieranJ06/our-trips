<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countries — Our Trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="site-header">
  <a class="site-header__mark" href="index.html">Our Trips</a>
  <nav>
    <a href="index.html">All trips</a>
  </nav>
</header>

<section class="hero">
  <h1>Countries visited</h1>
  <p id="map-count-text" class="map-count"></p>
</section>

<section class="map-section">
  <div class="map-frame">
    <object id="world-map-obj" type="image/svg+xml" data="assets/world-map.svg" aria-label="World map with visited countries highlighted"></object>
  </div>

  <div class="map-legend">
    <span class="map-legend__item"><span class="map-legend__swatch visited"></span> Visited</span>
    <span class="map-legend__item"><span class="map-legend__swatch"></span> Not yet</span>
  </div>

  <p class="map-note" id="map-note"></p>
</section>

<section class="map-section" style="padding-top: 0;">
  <div class="unesco-tracker__inner">
    <h2 class="unesco-tracker__title">Full list</h2>
    <ol class="country-grid is-open" id="full-country-grid"></ol>
  </div>
</section>

<footer class="site-footer">
  <p>A record of our trips, to share with family, added to after each one.</p>
</footer>

<script>
  // Update this as you tick off more countries. Codes are ISO 3166-1
  // alpha-2, matching the ids used in assets/world-map.svg.
  // A few very small countries (Barbados, Vatican City) aren't drawn as
  // separate shapes on this map at this scale, so they're listed
  // separately below rather than coloured in.
  const visitedCodes = [
    "au", "be", "ca", "cz", "gb", "fr", "it", "jp", "pt",
    "sc", "si", "za", "es", "bg", "de", "gr"
  ];

  const notOnMap = ["Barbados", "Vatican City"];

  const totalCountries = 198;
  const visitedTotal = visitedCodes.length + notOnMap.length;

  document.getElementById('map-count-text').textContent =
    visitedTotal + ' of ' + totalCountries + ' visited';

  const note = document.getElementById('map-note');
  if (notOnMap.length) {
    note.textContent = 'Also visited, too small to show separately on this map: ' + notOnMap.join(', ') + '.';
  }

  // Full name lookup, used for hover tooltips on every country on the map.
  const countryNames = {'_somaliland':'Somaliland','ad':'Andorra','ae':'United Arab Emirates','af':'Afghanistan','ag':'Antigua and Barbuda','ai':'Anguilla','al':'Albania','am':'Armenia','ao':'Angola','aq':'Antarctica','ar':'Argentina','as':'American Samoa','at':'Austria','au':'Australia','aw':'Aruba','ax':'Åland Islands','az':'Azerbaijan','ba':'Bosnia and Herzegovina','bb':'Barbados','bd':'Bangladesh','be':'Belgium','bf':'Burkina Faso','bg':'Bulgaria','bh':'Bahrain','bi':'Burundi','bj':'Benin','bl':'Saint Barthélemy','bm':'Bermuda','bn':'Brunei Darussalam','bo':'Bolivia','bq':'Bonaire, Sint Eustatius and Saba','br':'Brazil','bs':'Bahamas','bt':'Bhutan','bv':'Bouvet Island','bw':'Botswana','by':'Belarus','bz':'Belize','ca':'Canada','cc':'Cocos (Keeling) Islands','cd':'Democratic Republic of the Congo','cf':'Central African Republic','cg':'Republic of the Congo','ch':'Switzerland','ci':'Côte d\'Ivoire','ck':'Cook Islands','cl':'Chile','cm':'Cameroon','cn':'China','co':'Colombia','cr':'Costa Rica','cu':'Cuba','cv':'Cabo Verde','cw':'Curaçao','cx':'Christmas Island','cy':'Cyprus','cz':'Czech Republic','de':'Germany','dj':'Djibouti','dk':'Denmark','dm':'Dominica','do':'Dominican Republic','dz':'Algeria','ec':'Ecuador','ee':'Estonia','eg':'Egypt','eh':'Western Sahara','er':'Eritrea','es':'Spain','et':'Ethiopia','fi':'Finland','fj':'Fiji','fk':'Falkland Islands','fm':'Micronesia','fo':'Faroe Islands','fr':'France','ga':'Gabon','gb':'United Kingdom','gd':'Grenada','ge':'Georgia','gf':'French Guiana','gg':'Guernsey','gh':'Ghana','gi':'Gibraltar','gl':'Greenland','gm':'Gambia','gn':'Guinea','gp':'Guadeloupe','gq':'Equatorial Guinea','gr':'Greece','gs':'South Georgia and the South Sandwich Islands','gt':'Guatemala','gu':'Guam','gw':'Guinea-Bissau','gy':'Guyana','hk':'Hong Kong','hm':'Heard Island and McDonald Islands','hn':'Honduras','hr':'Croatia','ht':'Haiti','hu':'Hungary','id':'Indonesia','ie':'Ireland','il':'Israel','im':'Isle of Man','in':'India','io':'British Indian Ocean Territory','iq':'Iraq','ir':'Iran','is':'Iceland','it':'Italy','je':'Jersey','jm':'Jamaica','jo':'Jordan','jp':'Japan','ke':'Kenya','kg':'Kyrgyzstan','kh':'Cambodia','ki':'Kiribati','km':'Comoros','kn':'Saint Kitts and Nevis','kp':'North Korea','kr':'South Korea','kw':'Kuwait','ky':'Cayman Islands','kz':'Kazakhstan','la':'Laos','lb':'Lebanon','lc':'Saint Lucia','li':'Liechtenstein','lk':'Sri Lanka','lr':'Liberia','ls':'Lesotho','lt':'Lithuania','lu':'Luxembourg','lv':'Latvia','ly':'Libya','ma':'Morocco','mc':'Monaco','md':'Moldova','me':'Montenegro','mf':'Saint Martin (French part)','mg':'Madagascar','mh':'Marshall Islands','mk':'North Macedonia','ml':'Mali','mm':'Myanmar','mn':'Mongolia','mo':'Macao','mp':'Northern Mariana Islands','mq':'Martinique','mr':'Mauritania','ms':'Montserrat','mt':'Malta','mu':'Mauritius','mv':'Maldives','mw':'Malawi','mx':'Mexico','my':'Malaysia','mz':'Mozambique','na':'Namibia','nc':'New Caledonia','ne':'Niger','nf':'Norfolk Island','ng':'Nigeria','ni':'Nicaragua','nl':'Netherlands','no':'Norway','np':'Nepal','nr':'Nauru','nu':'Niue','nz':'New Zealand','om':'Oman','pa':'Panama','pe':'Peru','pf':'French Polynesia','pg':'Papua New Guinea','ph':'Philippines','pk':'Pakistan','pl':'Poland','pm':'Saint Pierre and Miquelon','pn':'Pitcairn','pr':'Puerto Rico','ps':'Palestine','pt':'Portugal','pw':'Palau','py':'Paraguay','qa':'Qatar','re':'Réunion','ro':'Romania','rs':'Serbia','ru':'Russia','rw':'Rwanda','sa':'Saudi Arabia','sb':'Solomon Islands','sc':'Seychelles','sd':'Sudan','se':'Sweden','sg':'Singapore','sh':'Saint Helena, Ascension and Tristan da Cunha','si':'Slovenia','sj':'Svalbard and Jan Mayen','sk':'Slovakia','sl':'Sierra Leone','sm':'San Marino','sn':'Senegal','so':'Somalia','sr':'Suriname','ss':'South Sudan','st':'Sao Tome and Principe','sv':'El Salvador','sx':'Sint Maarten (Dutch part)','sy':'Syria','sz':'Eswatini','tc':'Turks and Caicos Islands','td':'Chad','tf':'French Southern Territories','tg':'Togo','th':'Thailand','tj':'Tajikistan','tk':'Tokelau','tl':'Timor-Leste','tm':'Turkmenistan','tn':'Tunisia','to':'Tonga','tr':'Türkiye','tt':'Trinidad and Tobago','tv':'Tuvalu','tw':'Taiwan','tz':'Tanzania','ua':'Ukraine','ug':'Uganda','um':'United States Minor Outlying Islands','us':'United States','uy':'Uruguay','uz':'Uzbekistan','va':'Vatican City','vc':'Saint Vincent and the Grenadines','ve':'Venezuela','vg':'Virgin Islands, British','vi':'Virgin Islands, U.S.','vn':'Vietnam','vu':'Vanuatu','wf':'Wallis and Futuna','ws':'Samoa','ye':'Yemen','yt':'Mayotte','za':'South Africa','zm':'Zambia','zw':'Zimbabwe'};

  const mapObject = document.getElementById('world-map-obj');
  mapObject.addEventListener('load', function () {
    const svgDoc = mapObject.contentDocument;
    if (!svgDoc) return;

    // Step 1: colour every path the default "not visited" shade, and
    // add a hover tooltip with the country's name.
    svgDoc.querySelectorAll('path').forEach(function (path) {
      path.style.fill = '#d9d2c4';
      path.style.stroke = '#efeae3';
      path.style.strokeWidth = '0.5';
      path.style.transition = 'fill 0.1s ease';

      // The id for the tooltip lives either on this path directly,
      // or on its parent <g> for multi-piece countries (islands etc).
      let idEl = path;
      if (!idEl.getAttribute('id') && path.parentNode && path.parentNode.getAttribute) {
        const parentId = path.parentNode.getAttribute('id');
        if (parentId) idEl = path.parentNode;
      }
      const code = idEl.getAttribute('id');
      const name = code ? (countryNames[code] || code.replace(/^_/, '').replace(/-/g, ' ')) : null;
      if (name) {
        const title = svgDoc.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = name;
        path.appendChild(title);
      }
    });

    // Step 2: for each visited code, find the matching element by id.
    // Some countries are a single <path id="xx">; others (countries
    // with islands/territories) are a <g id="xx"> wrapping several
    // <path> pieces with no id of their own. Handle both. This must
    // run before the hover listeners below, so they capture the
    // correct final colour (green for visited) rather than the grey
    // default set in step 1.
    visitedCodes.forEach(function (code) {
      const el = svgDoc.getElementById(code);
      if (!el) return;
      if (el.tagName.toLowerCase() === 'g') {
        el.querySelectorAll('path').forEach(function (p) {
          p.style.fill = '#3e6259';
        });
      } else {
        el.style.fill = '#3e6259';
      }
    });

    // Step 3: hover highlight, darkening whichever path the mouse is
    // over, then restoring its correct base colour on mouse-out.
    svgDoc.querySelectorAll('path').forEach(function (path) {
      const baseFill = path.style.fill;
      path.addEventListener('mouseenter', function () {
        path.style.fill = baseFill === '#3e6259' ? '#2b473f' : '#c9bfaf';
      });
      path.addEventListener('mouseleave', function () {
        path.style.fill = baseFill;
      });
    });
  });

  // Full alphabetical list, same source list as the homepage tracker.
  // Names must match spelling exactly between the two lists.
  const visitedCountries = [
    "Australia", "Barbados", "Belgium", "Bulgaria", "Canada", "Czech Republic",
    "England", "France", "Germany", "Greece", "Italy", "Japan", "Northern Ireland",
    "Portugal", "Scotland", "Seychelles", "Slovenia", "South Africa", "Spain",
    "Vatican City", "Wales"
  ];

  const allCountries = [
    "Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia",
    "Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium",
    "Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria",
    "Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon","Canada","Central African Republic","Chad",
    "Chile","China","Colombia","Comoros","Congo (Republic of the)","Congo (Democratic Republic of the)",
    "Costa Rica","Côte d'Ivoire","Croatia","Cuba","Cyprus","Czech Republic","Denmark","Djibouti","Dominica",
    "Dominican Republic","Ecuador","Egypt","El Salvador","England","Equatorial Guinea","Eritrea","Estonia",
    "Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece",
    "Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hungary","Iceland","India",
    "Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya",
    "Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein",
    "Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands",
    "Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco",
    "Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger",
    "Nigeria","North Korea","North Macedonia","Northern Ireland","Norway","Oman","Pakistan","Palau",
    "Palestine","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar",
    "Romania","Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines",
    "Samoa","San Marino","São Tomé and Príncipe","Saudi Arabia","Scotland","Senegal","Serbia","Seychelles",
    "Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa",
    "South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria",
    "Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago","Tunisia",
    "Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United States","Uruguay",
    "Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Wales","Yemen","Zambia","Zimbabwe"
  ].sort();

  const fullGrid = document.getElementById('full-country-grid');
  allCountries.forEach(function (country, i) {
    const li = document.createElement('li');
    const num = document.createElement('span');
    num.className = 'country-num';
    num.textContent = (i + 1) + '.';
    li.appendChild(num);
    li.appendChild(document.createTextNode(' ' + country));
    if (visitedCountries.includes(country)) li.classList.add('visited');
    fullGrid.appendChild(li);
  });
</script>

</body>
</html>
