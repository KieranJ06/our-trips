<link rel="stylesheet" href="assets/styles.css">
<style>
  /* Hikes page. Reuses .unesco-tracker and .country-toggle from styles.css;
     only the pieces below are new. */
  .hike-stats {
    max-width: var(--wide-width);
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  @media (min-width: 640px) { .hike-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 900px) { .hike-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .hike-stat {
    background: var(--paper-raised);
    border-radius: 6px;
    padding: 1.25rem 1.4rem 1.4rem;
  }
  .hike-stat__label {
    margin: 0 0 0.6rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--rust);
  }
  .hike-stat__name {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.2rem;
    line-height: 1.25;
    color: var(--ink);
    margin: 0 0 0.2rem;
  }
  .hike-stat__meta { margin: 0.35rem 0 0; font-size: 0.9rem; color: var(--ink-soft); }
  .hike-stat ol { margin: 0; padding-left: 1.3rem; font-size: 0.93rem; color: var(--ink-soft); }
  .hike-stat ol li { padding: 0.18rem 0; }
  .hike-stat ol li span { color: var(--ink); font-weight: 600; }

  .hike-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

  .peak-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .peak-panel.is-open { max-height: 12000px; }

  .peak-region {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1rem;
    margin: 1.5rem 0 0.4rem;
    color: var(--ink);
  }
  .peak-region span { font-family: var(--font-body); font-size: 0.85rem; color: var(--ink-soft); font-weight: 400; margin-left: 0.4rem; }
  .peak-panel > .peak-region:first-child { margin-top: 1.5rem; }

  .peak-list { list-style: none; margin: 0; padding: 0; }
  .peak-list li {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.1rem 1rem;
    padding: 0.38rem 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 0.92rem;
    color: #a89f8f;
  }
  .peak-list li.visited { color: var(--ink); font-weight: 600; }
  .peak-list__name { flex: 1 1 12rem; overflow-wrap: anywhere; }
  .peak-list__meta { color: var(--ink-soft); font-weight: 400; font-size: 0.85rem; white-space: nowrap; }
  .peak-list li:not(.visited) .peak-list__meta { color: #a89f8f; }
  .peak-list li.visited .peak-list__meta strong { color: var(--rust); font-weight: 700; }
</style>
</head>

const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtH = n => n.toLocaleString('en-GB') + ' m';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const sum = a => a.reduce((x, y) => x + y, 0);

function bindToggle(btn, panel, label) {
  const set = () => { btn.textContent = (panel.classList.contains('is-open') ? 'Hide ' : 'Show all ') + label; };
  set();
  btn.addEventListener('click', () => { panel.classList.toggle('is-open'); set(); });
}

// ---------- Peaks & cols ----------
const peaks = SB.Peaks.map(([name, h, n, first, last]) => ({ name, h, n, first, last }));
const cols  = SB.Cols.map(([name, h, n, first, last]) => ({ name, h, n, first, last }));

  '<strong>' + peaks.length + '</strong> peaks and <strong>' + cols.length + '</strong> cols bagged \u00b7 ' +
  sum(peaks.map(p => p.n)) + ' peak bags in total';

function fillList(id, rows) {
  document.getElementById(id).innerHTML = [...rows].sort((a, b) => b.h - a.h).map(p =>
    '<li class="visited"><span class="peak-list__name">' + esc(p.name) + '</span>' +
    '<span class="peak-list__meta">' + (p.first === p.last ? fmtDate(p.first) : fmtDate(p.first) + ' \u2013 ' + fmtDate(p.last)) +
    ' \u00b7 <strong>' + p.n + '\u00d7</strong> \u00b7 ' + fmtH(p.h) + '</span></li>').join('');
}
fillList('peaks-list', peaks);
fillList('cols-list', cols);
bindToggle(document.getElementById('peaks-toggle'), document.getElementById('peaks-panel'), 'peaks');
bindToggle(document.getElementById('cols-toggle'), document.getElementById('cols-panel'), 'cols');

// ---------- Top X cards (peaks only) ----------
const top5 = [...peaks].sort((a, b) => b.h - a.h).slice(0, 5);
const maxN = Math.max(...peaks.map(p => p.n));
const mostBagged = peaks.filter(p => p.n === maxN);
const latest = peaks.map(p => p.last).sort().pop();
const mostRecent = peaks.filter(p => p.last === latest);
const earliest = peaks.map(p => p.first).sort()[0];
const longest = peaks.filter(p => p.first === earliest);

const single = (label, ps, meta) =>
  '<div class="hike-stat"><p class="hike-stat__label">' + label + '</p>' +
  ps.map(p => '<p class="hike-stat__name">' + esc(p.name) + '</p>').join('') +
  '<p class="hike-stat__meta">' + meta + '</p></div>';

document.getElementById('hike-stats').innerHTML =
  '<div class="hike-stat"><p class="hike-stat__label">Top 5 highest</p><ol>' +
    top5.map(p => '<li><span>' + esc(p.name) + '</span> \u00b7 ' + fmtH(p.h) + '</li>').join('') + '</ol></div>' +
  single('Most bagged', mostBagged, maxN + '\u00d7 \u00b7 first ' + fmtDate(mostBagged[0].first)) +
  single('Most recent', mostRecent, fmtDate(latest) + ' \u00b7 ' + fmtH(mostRecent[0].h)) +
  single('Longest-standing', longest, 'First bagged ' + fmtDate(earliest) + (longest.length > 1 ? ' (' + longest.length + '-way tie)' : ''));
